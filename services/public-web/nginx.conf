
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$time_iso8601 $remote_addr "$request" $status $body_bytes_sent '
                    '"$http_host" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile              on;
    keepalive_timeout     15;
    server_tokens         off;     
    client_max_body_size  16k;     
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;

    # Limita ráfagas por IP de origen (mitiga escaneos y abuso simple).
    limit_req_zone  $binary_remote_addr zone=por_ip:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_ip:10m;

    server {
        listen 80 default_server;
        server_name __PUBLIC_DOMAIN__ _;

        root  /usr/share/nginx/html/ventas;
        index index.html;

        limit_req  zone=por_ip burst=20 nodelay;
        limit_conn conn_ip 20;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

        location / {
            limit_except GET HEAD { deny all; }
            try_files $uri $uri/ =404;
        }

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok ventas.rednova\n";
        }

        location ~ /\. {
            deny all;
        }
    }
}
