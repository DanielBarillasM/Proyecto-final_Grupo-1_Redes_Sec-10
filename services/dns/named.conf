// =============================================================================
// /etc/named.conf - DNS interno de RedNova GT
// BIND9 sobre Amazon Linux 2023 - Data Center 10.10.0.160/28
// Servidor: ns1.rednova.internal (10.10.0.164)
// Responsable: Andrés Rafael Chivalán
//
// Funciones:
//   1. Autoritativo para la zona privada rednova.internal y su zona inversa.
//   2. Recursivo SOLO para las redes internas autorizadas; reenvía el resto de
//      nombres al resolvedor de la VPC (10.10.0.2, Route 53 Resolver).
//
// Visitas (10.10.0.0/26) y DMZ (10.10.0.192/27) quedan fuera de la ACL. El
// Security Group "dns" también las bloquea; esta ACL es defensa en profundidad.
// =============================================================================

acl "redes_autorizadas" {
    127.0.0.1;
    10.10.0.64/26;     // Ventas
    10.10.0.128/27;    // TI
    10.10.0.160/28;    // Data Center
    10.10.0.176/28;    // Administración
};

options {
    directory           "/var/named";
    dump-file           "/var/named/data/cache_dump.db";
    statistics-file     "/var/named/data/named_stats.txt";
    memstatistics-file  "/var/named/data/named_mem_stats.txt";
    pid-file            "/run/named/named.pid";

    // Solo escucha en loopback y en la IP privada asignada por Terraform.
    listen-on port 53   { 127.0.0.1; 10.10.0.164; };
    listen-on-v6        { none; };

    // Control de acceso a consultas, caché y recursión.
    allow-query         { redes_autorizadas; };
    allow-query-cache   { redes_autorizadas; };
    recursion           yes;
    allow-recursion     { redes_autorizadas; };

    // Sin transferencias de zona ni actualizaciones dinámicas.
    allow-transfer      { none; };
    allow-update        { none; };
    notify              no;

    // Nombres externos: reenvío exclusivo al resolvedor de la VPC.
    forwarders          { 10.10.0.2; };
    forward             only;

    // La validación DNSSEC se delega al Route 53 Resolver de la VPC.
    dnssec-validation   no;

    // Hardening: ocultar versión/identidad y limitar respuestas.
    version             "no disponible";
    hostname            none;
    server-id           none;
    minimal-responses   yes;
    rate-limit {
        responses-per-second 20;
        window 5;
    };

    // Registro de consultas: evidencia de qué cliente resolvió qué nombre.
    querylog            yes;
};

logging {
    channel general_log {
        file "data/named.log" versions 3 size 5m;
        severity info;
        print-time yes;
        print-severity yes;
        print-category yes;
    };
    channel query_log {
        file "data/queries.log" versions 3 size 10m;
        severity info;
        print-time yes;
    };
    category default  { general_log; };
    category security { general_log; };
    category queries  { query_log; };
    category lame-servers { null; };
};

// Zona directa interna.
zone "rednova.internal" IN {
    type master;
    file "db.rednova.internal";
    allow-update { none; };
};

// Zona inversa de la VPC 10.10.0.0/24.
zone "0.10.10.in-addr.arpa" IN {
    type master;
    file "db.10.10.0";
    allow-update { none; };
};
