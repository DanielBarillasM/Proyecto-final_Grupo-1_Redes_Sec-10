# /etc/systemd/resolved.conf.d/rednova-internal.conf
# DNS dividido (split DNS) para clientes internos: solo los nombres
# *.rednova.internal se envían a BIND9 (10.10.0.164). El resto sigue usando el
# resolvedor de la VPC entregado por DHCP (10.10.0.2).
#
# Aplicar en: clientes de Ventas, TI, Administración (bastión) y Data Center.
# NO aplicar en Visitas ni DMZ: esas redes no tienen permitido consultar BIND9.
[Resolve]
DNS=10.10.0.164
Domains=~rednova.internal ~0.10.10.in-addr.arpa
