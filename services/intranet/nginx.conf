# =============================================================================
# /etc/nginx/nginx.conf - Intranet de Recursos Humanos de RedNova GT
# Servidor: rrhh.rednova.internal (10.10.0.165) - Data Center 10.10.0.160/28
# Responsable: Andrés Rafael Chivalán
#
# Capas de control de acceso a la intranet:
#   1. Security Group "intranet": TCP/80 solo desde Ventas, TI, Data Center y
#      Administración (control principal; Visitas, DMZ e Internet no llegan).
#   2. Subred privada sin IP pública ni ruta a Internet.
#   3. allow/deny de Nginx con las mismas redes (defensa en profundidad).
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$time_iso8601 $remote_addr "$request" $status $body_bytes_sent '
                    '"$http_host" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile            on;
    keepalive_timeout   15;
    server_tokens       off;    # no revela la versión de Nginx
    client_max_body_size 16k;   # sitio estático: no acepta cargas
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Rechaza peticiones con un Host desconocido.
    server {
        listen 80 default_server;
        server_name _;
        access_log /var/log/nginx/access.log main;
        return 444;
    }

    server {
        listen 80;
        server_name rrhh.rednova.internal intranet.rednova.internal 10.10.0.165 localhost;

        root  /usr/share/nginx/html/rrhh;
        index index.html;

        # Redes internas autorizadas (mismas que el Security Group).
        allow 127.0.0.1;
        allow 10.10.0.64/26;    # Ventas
        allow 10.10.0.128/27;   # TI
        allow 10.10.0.160/28;   # Data Center
        allow 10.10.0.176/28;   # Administración
        deny  all;              # Visitas, DMZ, Internet y cualquier otro origen

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

        location / {
            limit_except GET HEAD { deny all; }
            try_files $uri $uri/ =404;
        }

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok rrhh.rednova.internal\n";
        }

        # Archivos ocultos (.git, .htaccess, etc.).
        location ~ /\. {
            deny all;
        }
    }
}
